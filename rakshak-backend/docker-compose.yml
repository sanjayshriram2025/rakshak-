version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: rakshak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rakshak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rakshak_password}
      POSTGRES_DB: ${POSTGRES_DB:-rakshak}
    ports:
      - "5432:5432"
    volumes:
      - rakshak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rakshak}"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    container_name: rakshak-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-rakshak_password}
      NEO4J_PLUGINS: '["graph-data-science"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - rakshak_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  rakshak-backend:
    build: .
    container_name: rakshak-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-rakshak}:${POSTGRES_PASSWORD:-rakshak_password}@postgres:5432/${POSTGRES_DB:-rakshak}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-rakshak_password}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - ./data:/app/data

volumes:
  rakshak_postgres_data:
  rakshak_neo4j_data:
